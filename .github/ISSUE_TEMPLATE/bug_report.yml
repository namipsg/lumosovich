name: Bug report
description: Report a reproducible problem with Lumosovich.
body:
  - type: markdown
    attributes:
      value: Please remove API keys, access tokens, and personal data from logs and examples. Report security vulnerabilities privately using SECURITY.md.
  - type: input
    id: package-version
    attributes:
      label: Lumosovich version
      placeholder: 0.4.0
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: 24.x
    validations:
      required: true
  - type: input
    id: method
    attributes:
      label: Lumosovich method or TMDB operation
      placeholder: movies.get / movie-details
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the call and any relevant redacted response shape.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
